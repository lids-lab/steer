[project]
name = "steer-griffin"
requires-python = ">=3.11"
version = "0.1.0"
description = "STEER's slimmed, inference-only copy of the from-scratch Griffin rebuild."

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
torch = "*"
accelerate = "*"
torchmetrics = "*"
torch_geometric = "*"
datasets = "*"
safetensors = "*"
scikit-learn = "*"
numpy = "*"
pyyaml = "*"
matplotlib = "*"
seaborn = "*"

[tool.pixi.dependencies]
python = "3.12.*"
