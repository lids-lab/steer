[project]
name = "steer-rt"
requires-python = "==3.12"
version = "0.1.0"
description = "STEER's slimmed, inference-only copy of the Relational Transformer (RT-12)."

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
torch = "==2.6.0"
einops = "*"
scikit-learn = "<1.6.0"
ml_dtypes = "*"

[tool.pixi.dependencies]
# Pinned: newer rustc rejects an unsafe transmute in a Cargo.lock dependency.
rust = "1.87.*"
maturin = "*"

[tool.pixi.tasks]
# Build the wheel and unzip it into site-packages (`maturin develop` fails to invoke rustc here).
build-sampler = { cmd = """
cd rustler && maturin build --release && cd .. &&
SITE_PACKAGES=$(python -c 'import site; print(site.getsitepackages()[0])') &&
unzip -o -d "$SITE_PACKAGES" rustler/target/wheels/rustler-*.whl 'rustler/*' &&
python -c 'from rustler import Sampler; print("rustler OK")'
""" }
