[project]
name = "steer-rt"
requires-python = "==3.12"
version = "0.1.0"
description = "STEER's slimmed, inference-only copy of the Relational Transformer (RT-12)."

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
torch = "==2.6.0"
einops = "*"
scikit-learn = "<1.6.0"
ml_dtypes = "*"

[tool.pixi.dependencies]
# Pinned to match the version the vendored Cargo.lock's dependency tree
# (e.g. ethnum 1.5.0) actually compiles under -- a newer rustc rejects one
# of its unsafe transmutes that used to be accepted.
rust = "1.87.*"
maturin = "*"

[tool.pixi.tasks]
# `maturin develop` hits a spurious "Permission denied" trying to invoke
# rustc in this environment (root cause not identified; plain `cargo`/
# `rustc` work fine). Workaround: build the wheel, then unzip just the
# compiled extension into site-packages by hand.
build-sampler = { cmd = """
cd rustler && maturin build --release && cd .. &&
SITE_PACKAGES=$(python -c 'import site; print(site.getsitepackages()[0])') &&
unzip -o -d "$SITE_PACKAGES" rustler/target/wheels/rustler-*.whl 'rustler/*' &&
python -c 'from rustler import Sampler; print("rustler OK")'
""" }
