[project]
name = "steer-rtj"
requires-python = "==3.12"
version = "0.1.0"
description = "Inference-only copy of RT-J with STEER's sampler."

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.maturin]
python-source = "."
manifest-path = "rustler/Cargo.toml"
module-name = "rt._rustler"
features = ["pyo3/extension-module"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
torch = "*"
safetensors = "*"
huggingface-hub = "*"
sentence-transformers = "*"
numpy = "*"
ml_dtypes = "*"
orjson = "*"
einops = "*"
scikit-learn = "<1.6.0"
lazy_loader = "*"
tqdm = "*"

[tool.pixi.dependencies]
rust = "*"
maturin = "*"

[tool.pixi.tasks]
# `maturin develop` can fail with "Permission denied" invoking rustc, so build
# the wheel and unzip only the compiled extension into rt/.
build-sampler = { cmd = """
maturin build --release &&
unzip -o -j rustler/target/wheels/steer_rtj-*.whl 'rt/_rustler.abi3.so' -d rt/ &&
python -c 'from rt._rustler import Sampler; print("rustler OK")'
""" }
