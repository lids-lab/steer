[project]
name = "steer-rtj"
requires-python = "==3.12"
version = "0.1.0"
description = "STEER's slimmed, inference-only copy of rt-j (the zero-shot foundation model)."

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.maturin]
python-source = "."
manifest-path = "rustler/Cargo.toml"
module-name = "rt._rustler"
features = ["pyo3/extension-module"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
torch = "*"
safetensors = "*"
huggingface-hub = "*"
sentence-transformers = "*"
numpy = "*"
ml_dtypes = "*"
orjson = "*"
einops = "*"
scikit-learn = "<1.6.0"
lazy_loader = "*"
tqdm = "*"

[tool.pixi.dependencies]
rust = "*"
maturin = "*"

[tool.pixi.tasks]
# `maturin develop` hits a spurious "Permission denied" trying to invoke
# rustc in this environment (same issue as RT's, see its pyproject.toml).
# Workaround: build the wheel, then unzip just the compiled extension into
# the editable rt/ package (module-name is nested as rt._rustler, so the
# wheel bundles a second copy of every .py file too -- only the .so is
# needed alongside the real source).
build-sampler = { cmd = """
maturin build --release &&
unzip -o -j rustler/target/wheels/steer_rtj-*.whl 'rt/_rustler.abi3.so' -d rt/ &&
python -c 'from rt._rustler import Sampler; print("rustler OK")'
""" }
