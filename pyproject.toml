[project]
name = "steer"
requires-python = ">=3.12"
version = "0.1.0"
description = "STEER: semantically informed sampling for relational foundation models."
license = { text = "Apache-2.0" }

[project.scripts]
steer = "steer.cli:main"
steer-generate-config = "steer.generate_config:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatchling.build.targets.wheel]
packages = ["steer"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
steer = { path = ".", editable = true }
polars = "*"
pyyaml = "*"
relbench = "*"
huggingface_hub = "*"

[tool.pixi.dependencies]
python = "3.12.*"
